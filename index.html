    <ul>
      <li><strong>Menu offers</strong> — drop in any restaurant's menu and sommify builds a wine offer to match, dish by
        dish, priced and ready to send.</li>
      <li><strong>Wine-list offers</strong> — feed it a customer's wine list and it matches every line to the closest

        questions in seconds.</li>
      <li><strong>Pricing help</strong> — set bottle and by-the-glass prices, see live margins, and layer volume
